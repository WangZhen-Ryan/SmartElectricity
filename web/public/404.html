<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      var redirect = location.pathname.replace('/SmartElectricity', '');
      if (redirect && redirect !== '/') {
        location.replace('/SmartElectricity/?redirect=' + encodeURIComponent(redirect));
      } else {
        location.replace('/SmartElectricity/');
      }
    </script>
  </head>
  <body></body>
</html>
